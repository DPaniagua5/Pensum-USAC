<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Documentación - Pensum USAC</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/themes/vue.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-dark-mode@latest/dist/style.min.css">
  <style>
    :root { --theme-color: #2563eb; }
    .sidebar { border-right: 1px solid #e2e8f0; }
    .app-name-link { font-weight: 700; }
  </style>
</head>
<body>
  <div id="app">Cargando documentación...</div>
  <script>
    window.$docsify = {
      name: 'Pensum-USAC',
      repo: 'dpaniagua5/Pensum-USAC',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      search: {
        placeholder: 'Buscar...',
        noData: 'Sin resultados',
      },
      darkMode: {
          light: { toggle: { title: 'Modo claro' } },
          dark:  { toggle: { title: 'Modo oscuro' } }
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-dark-mode@latest/dist/index.min.js"></script>
</body>
</html>
